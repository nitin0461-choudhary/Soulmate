services:
  - type: web
    name: soulmate-django
    env: python
    plan: free
    region: frankfurt
    # If your manage.py is not in the repo root, set rootDir
    # rootDir: .    # (keep as '.' if manage.py is at repo root)

    buildCommand: |
      python -m pip install --upgrade pip
      pip install Django gunicorn whitenoise dj-database-url psycopg2-binary python-dotenv
      python manage.py migrate --noinput
      python manage.py collectstatic --noinput

    startCommand: gunicorn Note_taking_project.wsgi:application --workers=2 --threads=4 --timeout=120

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: soulmate-db
          property: connectionString
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: soulmate-db
    plan: free
